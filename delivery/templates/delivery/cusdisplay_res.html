<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meal-Mate | Home</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

      body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); /* Gradient background */
        color: #333;
      }

      nav {
        background: linear-gradient(to right, #ff6a00, #ee0979);
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      }

      nav h2 {
        color: #fff;
        font-size: 26px;
        margin: 0;
        letter-spacing: 1px;
      }

      .nav-links {
        display: flex;
        gap: 15px;
      }

      .nav-links a {
        text-decoration: none;
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        padding: 10px 20px;
        border-radius: 30px;
        transition: all 0.3s ease;
        font-weight: 600;
        border: 1px solid transparent;
      }

      .nav-links a:hover {
        background: #fff;
        color: #ee0979;
        border: 1px solid #fff;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      main {
        padding: 50px 20px;
        max-width: 900px;
        margin: auto;
        text-align: center;
      }

      main h1 {
        font-size: 36px;
        margin-bottom: 20px;
        color: #000; /* Text color changed to black */
      }

      main p {
        font-size: 18px;
        color: #555;
        line-height: 1.6;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 30px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        background-color: #fff; /* Table background color */
      }

      th, td {
        padding: 15px;
        text-align: center;
        border: 1px solid #ddd;
        font-size: 16px;
      }

      th {
        background-color: #ff6a00;
        color: white;
      }

      tr:nth-child(even) {
        background-color: #f9f9f9;
      }

      tr:hover {
        background-color: #f1f1f1;
      }

      img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 8px;
      }

      button {
        padding: 10px 15px;
        border: none;
        border-radius: 6px;
        background-color: #4CAF50;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      button:hover {
        background-color: #45a049;
      }

      /* Mobile responsiveness */
      @media (max-width: 768px) {
        table {
          font-size: 14px;
        }

        nav {
          padding: 15px 20px;
        }

        nav h2 {
          font-size: 22px;
        }

        .nav-links a {
          font-size: 14px;
          padding: 8px 15px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <h2>Meal-Mate</h2>
      <div class="nav-links">
        <a href="{% url 'delivery:cusdisplay_res' username %}">View Restaurants</a>
        <a href="{% url 'delivery:sign_in' %}">Sign In</a>
        <a href="{% url 'delivery:sign_up' %}">Sign Up</a>
      </div>
    </nav>

    <main>
      <h1>Hi {{username}}, Explore the menu...!</h1>

      <table>
        <thead>
          <tr>
            <th>Restaurant Name</th>
            <th>Category</th>
            <th>Rating</th>
            <th>Image</th>
            <th>Address</th>
            <th>View Menu</th>
          </tr>
        </thead>
        <tbody>
          {% for item in li %}
          <tr>
            <td>{{ item.Res_name }}</td>
            <td>{{ item.Food_cat }}</td>
            <td>{{ item.rating }}</td>
            <td>
              <img src="{{ item.img }}" alt="Restaurant Image" />
            </td>
            <td>{{ item.address }}</td>
            <td>
              <a href="{% url 'delivery:cusmenu' item.id username %}">
                <button>View Menu</button>
              </a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </main>
    <footer>
      <p>&copy; 2025 Meal-Mate | All rights reserved</p>
    </footer>
  </body>
</html>
