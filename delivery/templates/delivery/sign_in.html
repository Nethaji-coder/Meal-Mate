<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meal-Mate | Home</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

      body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background-color: #f8f9fa;
        color: #333;
      }

      nav {
        background: linear-gradient(to right, #ff6a00, #ee0979);
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      }

      nav h2 {
        color: #fff;
        font-size: 26px;
        margin: 0;
        letter-spacing: 1px;
      }

      .nav-links {
        display: flex;
        gap: 15px;
      }

      .nav-links a {
        text-decoration: none;
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        padding: 10px 20px;
        border-radius: 30px;
        transition: all 0.3s ease;
        font-weight: 600;
        border: 1px solid transparent;
      }

      .nav-links a:hover {
        background: #fff;
        color: #ee0979;
        border: 1px solid #fff;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      main {
        padding: 50px 20px;
        max-width: 900px;
        margin: auto;
        text-align: center;
      }

      main h1 {
        font-size: 36px;
        margin-bottom: 20px;
        color: #ff6a00;
      }

      main p {
        font-size: 18px;
        color: #555;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <nav>
      <h2>Meal-Mate</h2>
      <div class="nav-links">
        <a href="{% url 'delivery:sign_in' %}">Sign In</a>
        <a href="{% url 'delivery:sign_up' %}">Sign Up</a>
      </div>
    </nav>

    <main>
    </main>
  </body>
</html>

<style>
    body {
        background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .signin-container {
        max-width: 400px;
        margin: 80px auto;
        padding: 35px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 15px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
        backdrop-filter: blur(8px);
        animation: fadeIn 0.8s ease-in-out;
    }

    .signin-container h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #2c3e50;
        font-size: 28px;
        font-weight: 600;
    }

    .signin-container label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #444;
        font-size: 14px;
    }

    .signin-container input[type="text"],
    .signin-container input[type="password"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    .signin-container input:focus {
        border-color: #ff6b81;
        box-shadow: 0 0 0 4px rgba(255, 107, 129, 0.2);
        outline: none;
    }

    .signin-container button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(to right, #ff6a00, #ee0979);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .signin-container button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(238, 9, 121, 0.4);
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(-15px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<div class="signin-container">
    <h2>Sign In</h2>
    <form method="POST" action="{% url 'delivery:handle_signin' %}">
        {% csrf_token %}
        <label for="username">Username</label>
        <input type="text" name="username" id="username" required />

        <label for="password">Password</label>
        <input type="password" name="password" id="password" required />

        <button type="submit">Sign In</button>
    </form>
</div>
