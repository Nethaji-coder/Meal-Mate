{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meal-Mate | Welcome</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .welcome-box {
      background-color: #fff;
      padding: 50px 40px;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.1);
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .welcome-box h3 {
      font-size: 32px;
      margin-bottom: 30px;
      font-weight: 600;
      background: linear-gradient(to right, #ff416c, #ff4b2b);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-box a {
      display: inline-block;
      margin: 10px 15px;
      padding: 14px 30px;
      background: linear-gradient(to right, #00b4db, #0083b0);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(0, 179, 219, 0.3);
      transition: all 0.3s ease;
    }

    .welcome-box a:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 10px 25px rgba(0, 179, 219, 0.5);
    }

    .welcome-box a.signin {
      background: linear-gradient(to right, #ff6a00, #ee0979);
      box-shadow: 0 6px 20px rgba(238, 9, 121, 0.3);
    }

    .welcome-box a.signin:hover {
      box-shadow: 0 10px 25px rgba(238, 9, 121, 0.5);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="welcome-box">
    <h3>Welcome to Meal-Mate</h3>
    <a href="{% url 'delivery:sign_up' %}" class="signup">Sign Up</a>
    <a href="{% url 'delivery:sign_in' %}" class="signin">Sign In</a>
  </div>
</body>
</html>
