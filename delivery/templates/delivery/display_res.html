{% extends "delivery/base.html" %}
{% block content %}

<style>
    body {
        background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
    }

    .table-container {
        margin: 60px auto;
        max-width: 1400px; /* Increased width */
        width: 98%; /* Adjusted to 98% of the screen width */
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        overflow-x: auto;
    }

    h2 {
        text-align: center;
        color: #ff6a00;
        margin-bottom: 25px;
        font-size: 28px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        text-align: center;
        border: 1px solid #ccc;
        font-size: 15px;
    }

    th, td {
        padding: 14px 18px;
        border: 1px solid #ddd;
    }

    th {
        background-color: #ff6a00;
        color: white;
        font-size: 16px;
        font-weight: 600;
    }

    tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    tr:hover {
        background-color: #f1f1f1;
    }

    img {
        border-radius: 8px;
        object-fit: cover;
    }

    button {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .update-btn {
        background-color: #3498db;
        color: white;
    }

    .delete-btn {
        background-color: #e74c3c;
        color: white;
    }

    .menu-btn {
        background-color: #2ecc71;
        color: white;
    }

    button:hover {
        transform: scale(1.05);
    }
</style>

<div class="table-container">
    <h2>Restaurants List</h2>
    <table>
        <thead>
            <tr>
                <th>Restaurant Name</th>
                <th>Category</th>
                <th>Rating</th>
                <th>Image</th>
                <th>Address</th>
                <th>Update</th>
                <th>Delete</th>
                <th>Menu</th>
            </tr>
        </thead>
        <tbody>
            {% for item in li %}
            <tr>
                <td>{{ item.Res_name }}</td>
                <td>{{ item.Food_cat }}</td>
                <td>{{ item.rating }}</td>
                <td>
                    <img src="{{ item.img }}" alt="Restaurant Image" width="100" height="100" />
                </td>
                <td>{{ item.address }}</td>
                <td>
                    <a href="{% url 'delivery:update_res' item.id %}">
                        <button class="update-btn">Update</button>
                    </a>
                </td>
                <td>
                    <a href="{% url 'delivery:delete_res' item.id %}"
                       onclick="return confirm('Are you sure you want to delete this restaurant?');">
                        <button class="delete-btn">Delete</button>
                    </a>
                </td>
                <td>
                    <a href="{% url 'delivery:view_menu' item.id %}">
                        <button class="menu-btn">View Menu</button>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
