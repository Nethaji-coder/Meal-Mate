<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meal-Mate | Home</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

      body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background-color: #f8f9fa;
        color: #333;
      }

      nav {
        background: linear-gradient(to right, #ff6a00, #ee0979);
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      }

      nav h2 {
        color: #fff;
        font-size: 26px;
        margin: 0;
        letter-spacing: 1px;
      }

      .nav-links {
        display: flex;
        gap: 15px;
      }

      .nav-links a {
        text-decoration: none;
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        padding: 10px 20px;
        border-radius: 30px;
        transition: all 0.3s ease;
        font-weight: 600;
        border: 1px solid transparent;
      }

      .nav-links a:hover {
        background: #fff;
        color: #ee0979;
        border: 1px solid #fff;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      main {
        padding: 50px 20px;
        max-width: 900px;
        margin: auto;
        text-align: center;
      }

      main h1 {
        font-size: 36px;
        margin-bottom: 20px;
        color: #ff6a00;
      }

      main p {
        font-size: 18px;
        color: #555;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <nav>
      <h2>Meal-Mate</h2>
      <div class="nav-links">
        <a href="{% url 'delivery:sign_in' %}">Sign In</a>
        <a href="{% url 'delivery:sign_up' %}">Sign Up</a>
      </div>
    </nav>

    <main>
    </main>
  </body>
</html>

<style>
    body {
        background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .signup-container {
        max-width: 480px;
        margin: 80px auto;
        padding: 40px 30px;
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        animation: fadeIn 0.6s ease-out;
    }

    .signup-container h2 {
        text-align: center;
        font-size: 28px;
        font-weight: 600;
        background: linear-gradient(to right, #ff416c, #ff4b2b);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 30px;
    }

    .signup-container label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #555;
    }

    .signup-container input[type="text"],
    .signup-container input[type="password"],
    .signup-container input[type="email"] {
        width: 100%;
        padding: 12px 14px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        transition: 0.3s ease;
    }

    .signup-container input:focus {
        border-color: #ff416c;
        box-shadow: 0 0 0 3px rgba(255, 65, 108, 0.15);
        outline: none;
    }

    .signup-container button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(to right, #ff416c, #ff4b2b);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s ease;
    }

    .signup-container button:hover {
        box-shadow: 0 0 12px rgba(255, 65, 108, 0.5);
        transform: scale(1.02);
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(-15px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

</style>

<div class="signup-container">
    <h2>Create Your Account</h2>
    <form method="POST" action="{% url 'delivery:handle_signup' %}">
        {% csrf_token %}
        <label for="username">Username</label>
        <input type="text" name="username" id="username" required />

        <label for="password">Password</label>
        <input type="password" name="password" id="password" required />

        <label for="email">Email</label>
        <input type="email" name="email" id="email" required />

        <label for="mobile">Mobile</label>
        <input type="text" name="mobile" id="mobile" required />

        <label for="address">Address</label>
        <input type="text" name="address" id="address" required />

        <button type="submit">Sign Up</button>
    </form>
</div>
