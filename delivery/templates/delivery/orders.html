<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'delivery/css/styles.css' %}" />
    <title>Order Summary</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

      body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); /* Gradient background */
        color: #333;
        padding: 0 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }

      .container {
        background: rgba(255, 255, 255, 0.9); /* Semi-transparent white background */
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        max-width: 700px;
        width: 100%;
        margin: 0 20px;
      }

      h1 {
        color: #4CAF50; /* Green color for the heading */
        font-size: 32px;
        margin-bottom: 20px;
      }

      h2 {
        color: #ff6a00; /* Orange color for subheadings */
        font-size: 24px;
        margin-top: 20px;
      }

      p {
        font-size: 18px;
        color: #555;
        line-height: 1.6;
        margin: 10px 0;
      }

      a {
        display: inline-block;
        background-color: #4CAF50;
        color: white;
        font-weight: bold;
        padding: 12px 25px;
        border-radius: 6px;
        text-decoration: none;
        margin-top: 20px;
        transition: background-color 0.3s ease;
      }

      a:hover {
        background-color: #45a049;
      }

      /* Mobile responsiveness */
      @media (max-width: 768px) {
        h1 {
          font-size: 28px;
        }

        h2 {
          font-size: 20px;
        }

        p {
          font-size: 16px;
        }

        a {
          padding: 10px 20px;
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Thank you for your order, {{ username }}!</h1>

      <h2>Delivery Address</h2>
      <p>{{ customer.address }}</p>

      <p>
        Your order will be delivered to this location shortly. Thank you for
        choosing Meal Mate!
      </p>

      {% if cart_items %}
        <a href="{% url 'customer_menu' cart_items.0.restaurant.id username %}">Back to Restaurants</a>
      {% else %}
        <a href="/">Back to Home</a>
      {% endif %}
    </div>
  </body>
</html>
