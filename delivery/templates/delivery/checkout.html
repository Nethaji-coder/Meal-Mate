<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

      body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: #f5f5f5; /* Light gray background */
        color: #333;
        padding: 0 20px;
      }

      /* Add background color to the entire page */
      .page-container {
        background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); /* Gradient background */
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      h1 {
        font-size: 36px;
        color: #ee0979;
        text-align: center;
        margin-top: 30px;
      }

      h2 {
        text-align: center;
        font-size: 24px;
        margin-top: 10px;
        color: #4CAF50;
      }

      .checkout-container {
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 30px;
        margin-top: 50px;
        max-width: 800px;
        width: 100%;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
      }

      table th,
      table td {
        padding: 12px;
        text-align: left;
        font-size: 18px;
      }

      table th {
        background-color: #ff6a00;
        color: white;
      }

      table td {
        border-bottom: 1px solid #ddd;
      }

      table tr:last-child td {
        border-bottom: none;
      }

      .total {
        font-size: 22px;
        font-weight: bold;
        text-align: right;
        margin-top: 20px;
        padding-right: 15px;
      }

      #rzp-button {
        display: inline-block;
        background-color: #4CAF50;
        color: white;
        font-size: 18px;
        padding: 12px 25px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease;
        width: 100%;
        text-align: center;
      }

      #rzp-button:hover {
        background-color: #45a049;
      }

      .error-message {
        color: red;
        font-size: 18px;
        text-align: center;
      }

      /* Mobile responsiveness */
      @media (max-width: 768px) {
        .checkout-container {
          padding: 20px;
        }

        h1 {
          font-size: 28px;
        }

        h2 {
          font-size: 20px;
        }

        table th,
        table td {
          font-size: 16px;
        }

        #rzp-button {
          padding: 10px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-container">
      <div class="checkout-container">
        <h1>Checkout</h1>
        <h2>Welcome, {{ username }}</h2>

        {% if error %}
          <p class="error-message">{{ error }}</p>
        {% else %}
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Price</th>
              </tr>
            </thead>
            <tbody>
              {% for item in cart_items %}
                <tr>
                  <td>{{ item.item_name }}</td>
                  <td>₹{{ item.price }}</td>
                </tr>
              {% endfor %}
            </tbody>
          </table>

          <p class="total">Total: ₹{{ total_price }}</p>

          <button id="rzp-button">Pay with Razorpay</button>
        {% endif %}
      </div>
    </div>

    <script>
      var options = {
        key: "{{ razorpay_key_id }}", // Razorpay API key
        amount: "{{ total_price|floatformat:2|add:'0.00'|floatformat:2 }}00", // Amount in paisa
        currency: "INR",
        name: "Meal Mate",
        description: "Order Payment",
        order_id: "{{ order_id }}", // Razorpay order ID
        handler: function (response) {
          alert("Payment Successful!");
          // Redirect to the orders page
          window.location.href = "{% url 'delivery:orders' username %}";
        },
        prefill: {
          name: "{{ username }}",
          email: "customer@example.com",
          contact: "9999999999",
        },
        theme: {
          color: "#528FF0",
        },
      };
      var rzp = new Razorpay(options);

      document.getElementById("rzp-button").onclick = function (e) {
        rzp.open();
        e.preventDefault();
      };
    </script>
  </body>
</html>
